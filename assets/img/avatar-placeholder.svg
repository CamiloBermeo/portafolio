<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo del avatar -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14172b" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>
    
    <!-- Gradiente de acento de luz -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- Fondo circular base -->
  <circle cx="250" cy="250" r="240" fill="url(#avatarBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Anillo de luz sutil -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 8" />

  <!-- Silueta estilizada de desarrollador -->
  <g fill="#94a3b8">
    <!-- Cabeza -->
    <ellipse cx="250" cy="180" rx="65" ry="75" fill="#cbd5e1" opacity="0.95" />
    
    <!-- Cabello / peinado moderno -->
    <path d="M185,170 C185,115 210,100 250,100 C290,100 315,115 315,170 C310,140 285,120 250,120 C215,120 190,140 185,170 Z" fill="#334155" />
    
    <!-- Gafas estilizadas -->
    <rect x="205" y="165" width="36" height="24" rx="6" fill="none" stroke="#60a5fa" stroke-width="3" />
    <rect x="259" y="165" width="36" height="24" rx="6" fill="none" stroke="#60a5fa" stroke-width="3" />
    <line x1="241" y1="175" x2="259" y2="175" stroke="#60a5fa" stroke-width="3" />

    <!-- Torso / Hoodie -->
    <path d="M140,390 C140,310 180,270 250,270 C320,270 360,310 360,390 C360,430 330,460 250,460 C170,460 140,430 140,390 Z" fill="#1e2238" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
    
    <!-- Cuello de hoodie y cordones -->
    <path d="M225,270 L250,330 L275,270 Z" fill="#0f111e" />
    <line x1="242" y1="320" x2="242" y2="360" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="258" y1="320" x2="258" y2="360" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Badge decorativo de código de fondo -->
  <g transform="translate(180, 410)">
    <rect width="140" height="34" rx="17" fill="rgba(30, 41, 59, 0.9)" stroke="url(#neonGlow)" stroke-width="1.5" />
    <text x="70" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">
      &lt;/&gt; Backend Java
    </text>
  </g>
</svg>
